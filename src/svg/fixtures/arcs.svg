<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100mm" height="100mm" viewBox="0 0 100 100" fill="none" stroke="#000000">
  <!-- Upper semicircle (y down), centre (30,30), r 20, from (10,30) to (50,30), sweep 1. -->
  <path id="semi" d="M10,30 A20,20 0 0 1 50,30"/>
  <!-- Large-arc three-quarter circle, centre (70,30), r 10, relative with compact flags. -->
  <path id="large" d="M80,30 a10,10 0 10-10-10"/>
  <!-- Rotated ellipse arc (rx 20 ry 10, 30 deg), full closed ellipse as two arcs. -->
  <path id="rot" d="M30,70 A20,10 30 1 1 30,70.0001 Z"/>
  <!-- Radii too small: scaled up to fit (a semicircle of r 10). -->
  <path id="small" d="M60,70 A1,1 0 0 0 80,70"/>
  <!-- Zero radius: a straight line. -->
  <path id="zero" d="M60,90 A0,5 0 0 0 90,90"/>
</svg>
